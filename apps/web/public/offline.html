<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174B3A">
<title>You're offline - Adey Connect</title>
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --text: #1E2321; --muted: #5D6661; --border: #E3E6E4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121514; --text: #F2F4F3; --muted: #A7AFAB; --border: rgba(255,255,255,0.12); } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 380px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 20px 0 8px; font-size: 24px; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
  button { height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #174B3A; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #E8B923; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/app-icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Adey Connect needs a connection to show businesses, deals and events. Check your Wi-Fi or data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
